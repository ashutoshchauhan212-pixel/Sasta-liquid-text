<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pranav">
<link rel="manifest" href="manifest.json">
<title>pranav — PDF & Canvas</title>
<style>
:root{color-scheme:dark;--bg:#111019;--panel:#1b1926;--panel2:#242132;--line:#393449;--text:#f4f0fb;--muted:#aaa3b9;--accent:#aa83f3;--accent2:#7955c8}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px}button.primary{background:var(--accent2);border-color:var(--accent2)}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#151320}
.logo{font-size:20px;font-weight:800}.logo span{color:var(--accent)}.header-actions{display:flex;gap:7px;align-items:center}
#app{height:calc(100dvh - 54px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-width:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}.pane:first-child{border-right:2px solid #51466c}
.panehead{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#191724;border-bottom:1px solid var(--line);gap:8px}
.panehead strong{font-size:14px}.tools{display:flex;gap:5px;align-items:center}.tools button{padding:7px 9px;font-size:12px}
#pdfArea{flex:1;min-height:0;overflow:auto;background:#252331;padding:14px;position:relative}
#placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:25px}
#pageWrap{position:relative;margin:0 auto 18px;background:white;box-shadow:0 5px 22px #0008;width:max-content;max-width:100%}
#pdfCanvas{display:block;max-width:100%;height:auto}
#textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;user-select:text;-webkit-user-select:text}
#textLayer span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;cursor:text}
#textLayer span::selection{background:#8c6bd688;color:transparent}
#canvasArea{flex:1;min-height:0;overflow:auto;position:relative;background-color:#171521;background-image:radial-gradient(#393448 0.8px,transparent .8px);background-size:19px 19px;touch-action:pan-x pan-y}
#board{position:relative;min-width:100%;min-height:100%;width:1800px;height:1300px}
.card{position:absolute;width:260px;min-height:100px;background:#282536;border:1px solid #65548a;border-radius:10px;box-shadow:0 5px 18px #0005;overflow:hidden;touch-action:none}
.card.selected{outline:2px solid var(--accent)}
.cardhead{height:31px;background:#342d47;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;color:#d9cafa;cursor:grab;touch-action:none}
.cardhead button{padding:1px 6px;font-size:13px;border:0;background:transparent}
.cardbody{padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.5;min-height:60px;user-select:text;touch-action:pan-y}
.cardbody[contenteditable=true]{outline:none}
.cardbody:empty:before{content:attr(data-placeholder);color:#8e879f}
.card img{max-width:100%;display:block}
#canvasHint{position:absolute;bottom:12px;left:12px;background:#201d2dcc;border:1px solid var(--line);padding:7px 10px;border-radius:8px;color:var(--muted);font-size:11px;pointer-events:none}
#pdfInput,#backupInput{display:none}
#docPicker{max-width:150px;background:#211e2c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}
#status{font-size:11px;color:var(--muted);padding:5px 12px;background:#171521;border-top:1px solid var(--line)}
@media(max-width:700px){header{height:48px}#app{height:calc(100dvh - 48px);grid-template-columns:1fr 1fr}.panehead{height:44px;padding:0 6px}.panehead strong{font-size:12px}.tools button{font-size:10px;padding:6px}.tools .wide{display:none}#pdfArea{padding:7px}#board{width:1200px;height:1100px}.card{width:220px}.logo{font-size:18px}}
@media(orientation:portrait) and (max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.pane:first-child{border-right:0;border-bottom:2px solid #51466c}}
</style>
</head>
<body>
<header>
 <div class="logo">pranav<span>.</span></div>
 <div class="header-actions">
  <label for="pdfInput"><button class="primary" type="button" onclick="document.getElementById('pdfInput').click()">＋ PDF</button></label>
  <input id="pdfInput" type="file" accept="application/pdf,.pdf">
  <button id="backupBtn">Backup</button>
  <button id="restoreBtn">Restore</button><input id="backupInput" type="file" accept="application/json">
 </div>
</header>
<div id="app">
 <section class="pane">
  <div class="panehead">
   <strong>PDF</strong>
   <div class="tools">
    <select id="docPicker" aria-label="Choose PDF"><option value="">No PDF open</option></select>
    <button id="prev">‹</button><span id="pageLabel" style="font-size:11px;color:var(--muted)">—</span><button id="next">›</button>
    <button id="zoomOut">−</button><button id="zoomIn">＋</button>
   </div>
  </div>
  <div id="pdfArea">
   <div id="placeholder"><div><div style="font-size:34px">▤</div><b>Open a PDF</b><p>Choose a judgment or document.<br>Its pages appear here.</p></div></div>
   <div id="pageWrap" hidden><canvas id="pdfCanvas"></canvas><div id="textLayer"></div></div>
  </div>
  <div class="panehead" style="height:42px">
   <div class="tools"><button id="addText" class="primary">Add selected text →</button><button id="addNote">＋ Note</button></div>
   <span style="font-size:10px;color:var(--muted)">Select text, then add it</span>
  </div>
 </section>
 <section class="pane">
  <div class="panehead">
   <strong>Writing canvas</strong>
   <div class="tools"><button id="newNote" class="primary">＋ Note</button><button id="clearSelection">Deselect</button></div>
  </div>
  <div id="canvasArea"><div id="board"></div><div id="canvasHint">Select PDF text → Add selected text · Drag cards to move · Tap a card to edit</div></div>
  <div id="status">Local workspace · Changes save automatically on this device</div>
 </section>
</div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const DB='pranav-legal-workspace',STORE='items';
let db,docs=[],current=null,pdf=null,pageNum=1,scale=1.25,items=[],selectedCard=null;
const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID();
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function del(id){return new Promise(res=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=res})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){let allItems=await all();docs=allItems.filter(x=>x.kind==='pdf');items=allItems.filter(x=>x.kind==='canvas'||x.kind==='extract');let picker=$('docPicker'),old=picker.value;picker.innerHTML='<option value="">Choose PDF</option>'+docs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('');if(current&&docs.some(d=>d.id===current.id))picker.value=current.id;else if(old&&docs.some(d=>d.id===old))picker.value=old;renderCards()}
async function importPDF(file){if(!file||file.type!=='application/pdf'){alert('Choose a PDF file.');return}let bytes=new Uint8Array(await file.arrayBuffer());let d={id:uid(),kind:'pdf',name:file.name,bytes,pages:0,added:new Date().toISOString()};try{let p=await pdfjsLib.getDocument({data:bytes.slice()}).promise;d.pages=p.numPages}catch(e){alert('Could not open this PDF.');return}await put(d);await refresh();await openDoc(d.id)}
async function openDoc(id){current=docs.find(d=>d.id===id);if(!current)return;pdf=await pdfjsLib.getDocument({data:current.bytes.slice()}).promise;pageNum=1;$('placeholder').hidden=true;$('pageWrap').hidden=false;await renderPage()}
async function renderPage(){if(!pdf)return;let page=await pdf.getPage(pageNum),vp=page.getViewport({scale});let c=$('pdfCanvas'),ctx=c.getContext('2d');c.width=vp.width;c.height=vp.height;c.style.width=vp.width+'px';c.style.height=vp.height+'px';$('pageWrap').style.width=vp.width+'px';$('pageWrap').style.height=vp.height+'px';$('textLayer').style.width=vp.width+'px';$('textLayer').style.height=vp.height+'px';$('textLayer').innerHTML='';await page.render({canvasContext:ctx,viewport:vp}).promise;
 let tc=await page.getTextContent();for(let it of tc.items){if(!it.str)continue;let tx=pdfjsLib.Util.transform(vp.transform,it.transform);let fontH=Math.hypot(tx[2],tx[3]);let span=document.createElement('span');span.textContent=it.str;span.style.left=tx[4]+'px';span.style.top=(tx[5]-fontH)+'px';span.style.fontSize=fontH+'px';span.style.fontFamily=it.fontName||'sans-serif';span.style.transform=`scaleX(${Math.max(.1,it.width*scale/(span.textContent.length*fontH*.5||1))})`;span.style.height=fontH+'px';$('textLayer').append(span)}
 $('pageLabel').textContent=`${pageNum} / ${pdf.numPages}`}
$('pdfInput').onchange=e=>importPDF(e.target.files[0]);$('docPicker').onchange=e=>openDoc(e.target.value);$('prev').onclick=()=>{if(pdf&&pageNum>1){pageNum--;renderPage()}};$('next').onclick=()=>{if(pdf&&pageNum<pdf.numPages){pageNum++;renderPage()}};$('zoomIn').onclick=()=>{scale=Math.min(2.5,scale+.15);renderPage()};$('zoomOut').onclick=()=>{scale=Math.max(.6,scale-.15);renderPage()};
function addCard(kind,text,x,y,source={}){let item={id:uid(),kind,text,x,y,w:kind==='note'?270:280,note:'',created:new Date().toISOString(),...source};put(item).then(refresh);return item}
function selectedText(){return window.getSelection()?.toString().trim()||''}
$('addText').onclick=()=>{let text=selectedText();if(!text){alert('First select text on the PDF page.');return}let r=$('canvasArea').getBoundingClientRect();let x=$('canvasArea').scrollLeft+60+(items.length%4)*25,y=$('canvasArea').scrollTop+65+(items.length%7)*28;addCard('extract',text,x,y,{sourceName:current?.name||'PDF',page:pageNum})};
$('addNote').onclick=$('newNote').onclick=()=>{let x=$('canvasArea').scrollLeft+70+(items.length%5)*22,y=$('canvasArea').scrollTop+70+(items.length%6)*25;addCard('note','',x,y)};
$('clearSelection').onclick=()=>{window.getSelection()?.removeAllRanges();selectedCard=null;renderCards()};
function renderCards(){let board=$('board');board.innerHTML='';items.forEach(item=>{let el=document.createElement('article');el.className='card'+(selectedCard===item.id?' selected':'');el.style.left=(item.x||40)+'px';el.style.top=(item.y||40)+'px';el.style.width=(item.w||270)+'px';let head=document.createElement('div');head.className='cardhead';let label=document.createElement('span');label.textContent=item.kind==='extract'?`${item.sourceName||'PDF'} · p.${item.page||1}`:'NOTE';let actions=document.createElement('span');let remove=document.createElement('button');remove.textContent='×';remove.onclick=async e=>{e.stopPropagation();await del(item.id);await refresh()};actions.append(remove);head.append(label,actions);let body=document.createElement('div');body.className='cardbody';body.contentEditable='true';body.spellcheck=true;body.textContent=item.text||'';body.dataset.placeholder=item.kind==='note'?'Write here…':'Extracted PDF text';body.oninput=()=>{item.text=body.innerText;put(item)};el.append(head,body);el.onpointerdown=()=>{selectedCard=item.id};head.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;e.preventDefault();selectedCard=item.id;let sx=e.clientX,sy=e.clientY,ox=item.x||40,oy=item.y||40;head.setPointerCapture(e.pointerId);const move=ev=>{item.x=ox+ev.clientX-sx;item.y=oy+ev.clientY-sy;el.style.left=item.x+'px';el.style.top=item.y+'px'};const up=()=>{head.removeEventListener('pointermove',move);head.removeEventListener('pointerup',up);put(item)};head.addEventListener('pointermove',move);head.addEventListener('pointerup',up,{once:true})};board.append(el)})}
$('backupBtn').onclick=async()=>{let data=await all();let blob=new Blob([JSON.stringify(data,(k,v)=>v instanceof Uint8Array?{__bytes:Array.from(v)}:v)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pranav-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('restoreBtn').onclick=()=>$('backupInput').click();$('backupInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=JSON.parse(await f.text());for(let x of data){if(x.bytes?.__bytes)x.bytes=new Uint8Array(x.bytes.__bytes);await put(x)}await refresh();alert('Backup restored.')};
try{db=await openDB();await refresh();let first=docs[0];if(first)await openDoc(first.id);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){console.error(e);alert('Could not access local storage.')}
</script>
</body></html>
